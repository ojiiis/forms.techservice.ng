<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth Form</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 380px;
        background: #fff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .tabs {
        display: flex;
        margin-bottom: 20px;
    }

    .tabs button {
        flex: 1;
        padding: 10px;
        border: none;
        background: #eee;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }

    .tabs button.active {
        background: #007bff;
        color: white;
    }

    form {
        display: none;
        flex-direction: column;
    }

    form.active {
        display: flex;
    }

    input {
        padding: 12px;
        margin-bottom: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
    }

    button.submit-btn {
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #007bff;
        color: white;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
    }

    button.submit-btn:hover {
        background: #0056b3;
    }

    @media (max-width: 480px) {
        .container {
            margin: 10px;
            padding: 20px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <div class="tabs">
        <button id="loginTab" class="active">Login</button>
        <button id="registerTab">Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="active">
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button class="submit-btn">Login</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm">
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button class="submit-btn">Register</button>
    </form>
</div>

<script>
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    loginTab.onclick = () => {
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
    };

    registerTab.onclick = () => {
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
    };
    loginForm.onsubmit = async(e) => {
        e.preventDefault();
       let email = loginForm.querySelector('input[type="email"]').value;
       let password = loginForm.querySelector('input[type="password"]').value;
       await fetch('/signin',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email,password})
       }).then(res=>res.json()).then(data=>{
        if(data.status){
            alert('Login successful! Redirecting to dashboard...');
            window.location.href = '/dashboard';
        }else{
            alert('Login failed: ' + data.message);
        }
       }).catch(err=>{
        alert('An error occurred: ' + err.message);
       });      
        
    };
    registerForm.onsubmit = async(e) => {
        e.preventDefault();
        let fullname = registerForm.querySelector('input[placeholder="Full Name"]').value;
        let email = registerForm.querySelector('input[placeholder="Email"]').value;
        let password = registerForm.querySelector('input[placeholder="Password"]').value;
        await fetch('/signup',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({email,password,fullname})
        }).then(res=>res.json()).then(data=>{
            if(data.status){
                alert('Registration successful! Redirecting to dashboard...');
                window.location.href = '/dashboard';
            }else{
                alert('Registration failed: ' + data.message);
            }
        }).catch(err=>{
            alert('An error occurred: ' + err.message);
        });
    };
    
</script>

</body>
</html>
