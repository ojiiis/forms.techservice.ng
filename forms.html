<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard | FormFlow API - Submission Management</title>
        <meta name="robots" content="noindex, nofollow">

        <link rel="icon" href="/assets/images/favicon.png">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
            integrity="..." crossorigin="anonymous"
            referrerpolicy="no-referrer" />
        <link rel="stylesheet"
            href="https://techservice.ng/assets/css/styles.css">
        <link rel="stylesheet" href="/assets/css/styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
            rel="stylesheet">
    </head>
    <body>
     include("header.html");

        <main id="main-content">
            <div class="dashboard-wrapper">

                <nav id="app-navbar">
                    <ul>
                        <li><a href="/dashboard"><i class="fas fa-home"></i>
                                Overview</a></li>
                        <li><a href="/submissions"><i
                                    class="fas fa-list-alt"></i>
                                Submissions</a></li>
                        <li class="active"><a href="/forms"><i
                                    class="fas fa-file-code"></i> My
                                Forms</a></li>
                        <!-- <li><a href="/settings"><i class="fas fa-cogs"></i>
                                Settings</a></li> -->
                    </ul>
                </nav>

                <section id="forms-list-page">
                    <header class="forms-header-controls">
                        <h1>My Forms</h1>

                        <div class="form-controls">

                            <div class="control-group search-group">
                                <input type="text" id="search-form"
                                    placeholder="Search forms by ID..."
                                    class="control-input">
                                <button class="btn btn-secondary btn-sm"><i
                                        class="fas fa-search"></i></button>
                            </div>

                            <a href="/new"><button class="btn btn-primary create-form-btn">
                                <i class="fas fa-plus"></i> Create New Form
                            </button></a>
                        </div>
                    </header>

                    <div class="forms-inventory-grid">
                        <for exp="$i (in) $forms">
                            <div class="form-card card">
                                <div class="form-card-header">
                                    <h3>$i.form_label</h3>
                                    <span
                                        class="form-status active">Active</span>
                                </div>

                                <div class="form-details">
                                    <p><strong>Form ID:</strong>
                                        <code>$i.form_id</code></p>
                                    <p><strong>Total Submissions:</strong>
                                        $i.total_received</p>
                                    <p><strong>Last Submission:</strong> $i.last_received</p>
                                </div>

                                <div class="form-actions">
                                    <a href="/forms/contact-us-123/config"
                                        class="btn btn-secondary btn-sm"><i
                                            class="fas fa-cogs"></i>
                                        Settings</a>
                                    <a href="/submissions/$i.form_id"
                                        class="btn btn-primary btn-sm"><i
                                            class="fas fa-list-alt"></i> View
                                        Submissions</a>
                                </div>
                            </div>
                        </for>

                    </div>
                </section>

            </div>
        </main>

        <footer id="site-footer" class="footer-section">
        </footer>
        <script src="/assets/js/dashboard.js"></script>
    </body>
</html>
