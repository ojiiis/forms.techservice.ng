  include("header.html")

        <main id="main-content">
            <div class="dashboard-wrapper">

                <nav id="app-navbar">
                    <ul>
                        <li><a href="/dashboard"><i class="fas fa-home"></i>
                                Overview</a></li>
                        <li class="active"><a href="/submissions"><i
                                    class="fas fa-list-alt"></i>
                                Submissions</a></li>
                        <li><a href="/forms"><i class="fas fa-file-code"></i> My
                                Forms</a></li>
                        <!-- <li><a href="/settings"><i class="fas fa-cogs"></i>
                                Settings</a></li> -->
                    </ul>
                </nav>

                <section id="submissions-list-page">
                    <header class="submissions-header-controls">
                        <h1>All Submissions</h1>

                        <div class="submission-controls">

                            

                            <div class="control-group search-group">
                                <input type="text" id="search-input"
                                    placeholder="Search by name, email, or content..."
                                    class="control-input">
                                <button class="btn btn-secondary btn-sm"><i
                                        class="fas fa-search"></i></button>
                            </div>

                            <button class="btn btn-primary export-btn">
                                Export to CSV <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </header>

                    <div class="submissions-table-container card">
                        <table>
                            <thead>
                                <tr>
                                    <th class="col-checkbox"><input
                                            type="checkbox"
                                            id="select-all"></th>
                                    <th class="col-form">Form</th>
                                    <th class="col-date">Received</th>
                                    <th class="col-name">First value</th>
                                    <th
                                        class="col-email desktop-only">Second value</th>
                                    <th class="col-status">Status</th>
                                    <th class="col-actions">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                            <for exp="$i (in) $forms ">
                                <tr class="submission-row unread">
                                    <td class="col-checkbox"><input
                                            type="checkbox"></td>
                                    <td class="col-form">$i.form_label</td>
                                    <td class="col-date"><b>$i.date</b></td>
                                    <td class="col-name"><b>$i.firstData</td>
                                    <td
                                        class="col-email desktop-only">$i.secoundData</td>
                                    <td class="col-status"><span
                                            class="status-badge new">NEW</span></td>
                                    <td class="col-actions"><a
                                            href="/submissions/view/$i.id"><i
                                                class="fas fa-eye"></i>
                                            View</a></td>
                                </tr>
                             </for>
